<svg xmlns="http://www.w3.org/2000/svg" width="384" height="536" viewBox="0 0 384 536" lang="en" role="img" aria-labelledby="title" aria-describedby="desc">
  <title id="title">What the Level 3 turn records showed</title>
  <desc id="desc">Six parallel lines of team research converged in shared turn records pairing an agent reply with its tool call. The archived Haiku 5.5 turns contained no patient record. A Sonnet 5.5 reply confirmed a proposed match. That reply printed no record, but it revealed the private link between two already known identifiers.</desc>
  <rect width="384" height="536" rx="12" fill="#F5F5F2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#242421">
    <text x="18" y="27" font-size="15" fill="#5B5B56">Entropy Level 3 · Our red-team strategy</text>
    <text x="18" y="56" font-family="Georgia, serif" font-size="23">Could a reply reveal a match</text>
    <text x="18" y="81" font-family="Georgia, serif" font-size="23">without revealing a record?</text>
    <g transform="translate(0 48)">
    <text x="18" y="60" font-size="16" fill="#5B5B56">6 parallel investigations</text>
    <g fill="none" stroke="#757570" stroke-width="1.6">
      <path d="M32 79v7c0 24 122 11 160 36"/>
      <path d="M96 79v7c0 20 72 16 96 36"/>
      <path d="M160 79v7c0 19 24 23 32 36"/>
      <path d="M224 79v7c0 19-24 23-32 36"/>
      <path d="M288 79v7c0 20-72 16-96 36"/>
      <path d="M352 79v7c0 24-122 11-160 36"/>
      <path d="M192 122v12"/>
    </g>
    <g fill="#F5F5F2" stroke="#52524F" stroke-width="1.6">
      <circle cx="32" cy="79" r="3.2"/><circle cx="96" cy="79" r="3.2"/><circle cx="160" cy="79" r="3.2"/>
      <circle cx="224" cy="79" r="3.2"/><circle cx="288" cy="79" r="3.2"/><circle cx="352" cy="79" r="3.2"/>
    </g>
    <path d="M188 131h8l-4 7z" fill="#52524F"/>
    <rect x="79" y="139" width="226" height="64" rx="5" fill="#FFF" stroke="#93938C"/>
    <g text-anchor="middle">
      <text x="192" y="165" font-size="20" font-weight="bold">Shared turn records</text>
      <text x="192" y="188" font-size="17" fill="#50504C">Agent reply + tool call</text>
    </g>
    <g stroke="#686864" fill="none" stroke-width="1.6">
      <path d="M192 203v11"/>
      <path d="M192 214H104q-4 0-4 4v14 M192 214h88q4 0 4 4v14"/>
    </g>
    <path d="M96 230h8l-4 7z M280 230h8l-4 7z" fill="#52524F"/>
    <g fill="#FCFCFA" stroke="#B5B5AF">
      <rect x="14" y="238" width="172" height="114" rx="5"/><rect x="198" y="238" width="172" height="114" rx="5"/>
    </g>
    <g font-size="20" font-weight="bold">
      <text x="27" y="266">Haiku 5.5</text><text x="211" y="266">Sonnet 5.5</text>
    </g>
    <g font-size="17" fill="#393936">
      <text x="27" y="294">No patient record<tspan x="27" dy="22">in archived turns.</tspan></text>
      <text x="211" y="294">Reply count: 0<tspan x="211" dy="22">for the control, 55</tspan><tspan x="211" dy="22">for one match.</tspan></text>
    </g>
    <path d="M284 352v18" fill="none" stroke="#B03720" stroke-width="1.8"/>
    <path d="M280 367h8l-4 7z" fill="#B03720"/>
    <path d="M14 376h356" stroke="#B03720" stroke-width="2"/>
    <text x="18" y="404" font-family="Georgia, serif" font-size="23" fill="#A6321E">The link was private</text>
    <text x="18" y="431" font-size="17">The reply printed no record, but it revealed<tspan x="18" dy="23">that the two known identifiers belonged to</tspan><tspan x="18" dy="23">the same patient.</tspan></text>
    </g>
  </g>
</svg>
