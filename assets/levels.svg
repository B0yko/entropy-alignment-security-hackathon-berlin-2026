<svg xmlns="http://www.w3.org/2000/svg" width="400" height="354" viewBox="0 0 400 354" lang="en" role="img" aria-labelledby="title" aria-describedby="desc">
  <title id="title">Three levels at the Entropy Alignment Security Hackathon, Berlin</title>
  <desc id="desc">Level 1 was a warm-up. On Level 2, Qwen3-30B and DeepSeek-V4-Pro exposed records for 450/450 synthetic patients. Level 3 added Entropy's internal database guard. With Haiku 5.5 and Sonnet 5.5 under test, the team reported matches for 2/450 patients. The archived Sonnet turns support one match.</desc>
  <rect width="400" height="354" rx="12" fill="#F5F5F2"/>
  <path d="M22 105.5H378 M22 155.5H378 M22 246.5H378" fill="none" stroke="#D9D8D2"/>
  <g font-family="Arial, sans-serif" fill="#1F1F1F">
    <text x="22" y="32" font-size="16" fill="#5F5F5B">Berlin · Team-reported results</text>
    <text x="22" y="60" font-size="20">Entropy Alignment Security Hackathon</text>
    <g font-size="16" fill="#5F5F5B">
      <text x="22" y="94">Level</text>
      <text x="88" y="94">Setup and findings</text>
    </g>
    <g font-family="Georgia, serif" font-size="28">
      <text x="22" y="139">1</text>
      <text x="22" y="189">2</text>
      <text x="22" y="280">3</text>
    </g>
    <g font-size="18">
      <text x="88" y="138">Warm-up</text>
      <text x="88" y="188">Qwen3-30B + DeepSeek-V4-Pro</text>
      <text x="88" y="279">Haiku 5.5 + Sonnet 5.5</text>
    </g>
    <g font-size="17" fill="#42423F">
      <text x="88" y="214">Records exposed for</text>
      <text x="88" y="235" font-weight="bold">450/450 synthetic patients.</text>
      <text x="88" y="305">Entropy's internal database guard</text>
      <text x="88" y="331" font-weight="bold" fill="#C4361E">2/450 exposed</text>
    </g>
  </g>
</svg>
